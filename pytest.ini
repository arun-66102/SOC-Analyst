[pytest]
# ============================================================
# pytest.ini — SOC Analyst test configuration
# Author: Member 4 — Synthetic Log Generator & Testing Setup
# ============================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio_mode = auto allows async test functions to run without
# the @pytest.mark.asyncio decorator (requires pytest-asyncio >= 0.21)
asyncio_mode = auto

# Show extra summary info for skipped/failed/error
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers (prevents PytestUnknownMarkWarning)
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require DB or external API
    requires_datasets: marks tests that require CICIDS2017 / UNSW-NB15 CSVs
    asyncio: marks async tests (used by pytest-asyncio)
